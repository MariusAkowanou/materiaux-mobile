<ion-content [fullscreen]="true" style="--background: transparent">
  <!-- Fond dégradé surface warm avec Tailwind -->
  <div class="flex min-h-full flex-col items-center justify-center bg-gradient-to-br from-[#FFF8F3] via-[#F8F5F1] to-[#FFF0E6] px-6 py-12">

    <!-- ─── Hero / Logo ─────────────────────────────────────────── -->
    <div class="mb-8 flex w-full max-w-sm flex-col items-center gap-4 animate-fade-in">
      
     

      <!-- Titre et explication -->
      <div class="text-center">
        <h1 class="text-2xl font-black tracking-tight text-gray-900">
          Vérification
        </h1>
        <p class="mt-1 px-4 text-sm font-medium text-gray-400">
          Nous venons d'envoyer un code de validation par e-mail et SMS.
        </p>
      </div>
    </div>

    <!-- ─── Card OTP ─────────────────────────────────────── -->
    <div class="flex w-full max-w-sm flex-col gap-6 rounded-[2rem] bg-white p-8 shadow-2xl shadow-gray-200/50 animate-slide-up">

      <!-- En-tête card -->
      <div class="text-center">
        <h2 class="text-xl font-bold text-gray-900">
          Code de sécurité
        </h2>
        <p class="mt-1 text-xs font-medium text-gray-400">
          Saisissez les 6 chiffres pour continuer
        </p>
      </div>

      <!-- ─── Formulaire ───────────────────────────────────────── -->
      <form [formGroup]="form"
            (ngSubmit)="submit()"
            class="flex flex-col gap-5"
            novalidate>

        <!-- Champ OTP -->
        <div class="flex flex-col items-center gap-2">
          <input id="verify-otp-code"
                 type="text"
                 inputmode="numeric"
                 formControlName="otp_code"
                 placeholder="0 0 0 0 0 0"
                 maxlength="6"
                 class="w-full rounded-2xl border-2 bg-gray-50/50 py-4 text-center text-3xl font-black tracking-[0.4em] text-gray-950 outline-none transition-all duration-300 placeholder:text-gray-100 focus:bg-white"
                 [class.border-danger]="otpCode.invalid && otpCode.touched"
                 [class.border-gray-50]="!(otpCode.invalid && otpCode.touched)"
                 [class.focus:border-primary]="!(otpCode.invalid && otpCode.touched)" />

          @if (otpCode.invalid && otpCode.touched) {
            <p class="text-[10px] font-bold uppercase tracking-wider text-danger animate-fade-in">
              Code à 6 chiffres requis
            </p>
          }
        </div>

        <!-- Bouton de validation -->
        <button id="otp-submit-btn"
                type="submit"
                [disabled]="isLoading()"
                class="mt-2 flex w-full items-center justify-center gap-3 rounded-2xl bg-primary !py-4 text-sm font-black uppercase tracking-widest text-white shadow-xl shadow-primary/30 transition-all duration-200 hover:brightness-110 active:scale-[0.97] disabled:opacity-50 disabled:grayscale">

          @if (isLoading()) {
            <i class="pi pi-spin pi-spinner text-lg"></i>
            <span>Vérification...</span>
          } @else {
            <i class="pi pi-check-circle text-lg"></i>
            <span>Confirmer</span>
          }
        </button>

      </form>

      <!-- Action de renvoi -->
      <div class="flex flex-col items-center pt-2">
        <p class="text-xs font-bold uppercase tracking-widest text-gray-300">
          Rien reçu ?
        </p>
        <button type="button" 
                (click)="resendOtp()"
                class="mt-1 text-sm font-black text-primary transition-colors hover:text-primary-dark underline underline-offset-4 decoration-primary/20">
          Renvoyer le code
        </button>
      </div>

    </div>

    <!-- Lien retour aide -->
    <p class="mt-8 text-center text-sm font-medium text-gray-400 animate-fade-in">
      Erreur dans votre email ?&nbsp;
      <a routerLink="/auth/register"
         class="font-black text-primary transition-colors hover:text-primary-dark underline underline-offset-4 decoration-primary/20">
        Modifier le compte
      </a>
    </p>

  </div>
</ion-content>
