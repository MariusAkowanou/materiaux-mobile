<ion-modal
      [isOpen]="isOpen"
      [initialBreakpoint]="0.75"
      [breakpoints]="[0, 0.75]"
      (ionModalDidDismiss)="onDismiss.emit()"
    >
      <ng-template>
        <ion-header class="ion-no-border">
          <ion-toolbar>
            <ion-buttons slot="start">
              <ion-button fill="clear" color="medium" (click)="onDismiss.emit()">
                <i class="pi pi-times text-lg"></i>
              </ion-button>
            </ion-buttons>
            <ion-title class="font-bold text-gray-900">Nouveau tarif</ion-title>
          </ion-toolbar>
        </ion-header>

        <ion-content class="ion-padding">
          <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4 pt-2">

            <!-- Type de camion -->
            <div class="flex flex-col gap-1">
              <label class="text-sm font-semibold text-gray-700">Type de camion</label>
              <div class="rounded-xl border border-gray-200 bg-white overflow-hidden">
                <ion-item lines="none">
                  <ion-select
                    formControlName="camion_type_id"
                    placeholder="Sélectionner un camion"
                    interface="action-sheet"
                  >
                    @for (c of camions; track c.id) {
                      <ion-select-option [value]="c.id">
                        {{ c.libelle }} — {{ c.capacite_m3 }} m³
                      </ion-select-option>
                    }
                  </ion-select>
                </ion-item>
              </div>
            </div>

            <!-- Mode de tarification -->
            <div class="flex flex-col gap-1">
              <label class="text-sm font-semibold text-gray-700">Mode de tarification</label>
              <div class="grid grid-cols-2 gap-2">
                @for (mode of modes; track mode.value) {
                  <button
                    type="button"
                    class="flex flex-col items-center gap-1 !rounded-xl border-2 !p-3 transition-all duration-200"
                    [style.border-color]="form.get('mode_tarif')!.value === mode.value
                      ? 'var(--ion-color-primary)' : '#e5e7eb'"
                    [style.background]="form.get('mode_tarif')!.value === mode.value
                      ? 'color-mix(in srgb, var(--ion-color-primary) 8%, white)' : 'white'"
                    (click)="form.get('mode_tarif')!.setValue(mode.value)"
                  >
                    <i [class]="'pi ' + mode.icon + ' text-xl'"
                       [style.color]="form.get('mode_tarif')!.value === mode.value
                         ? 'var(--ion-color-primary)' : '#9ca3af'"></i>
                    <span class="text-xs font-semibold"
                          [style.color]="form.get('mode_tarif')!.value === mode.value
                            ? 'var(--ion-color-primary)' : '#6b7280'">{{ mode.label }}</span>
                  </button>
                }
              </div>
            </div>

            <!-- Prix -->
            <div class="flex flex-col gap-1">
              <label class="text-sm font-semibold text-gray-700">
                Prix (FCFA / {{ form.get('mode_tarif')!.value === 'km' ? 'km' : 'voyage' }})
              </label>
              <div class="rounded-xl border border-gray-200 bg-white overflow-hidden">
                <ion-item lines="none">
                  <ion-input
                    formControlName="prix"
                    type="number"
                    placeholder="Ex : 2500"
                    inputmode="numeric"
                  ></ion-input>
                </ion-item>
              </div>
              @if (form.get('prix')!.invalid && form.get('prix')!.touched) {
                <p class="text-xs text-red-500 mt-0.5">Veuillez saisir un prix valide</p>
              }
            </div>

            <!-- Bouton soumettre -->
            <ion-button
              type="submit"
              expand="block"
              color="primary"
              [disabled]="form.invalid || isSubmitting"
              class="rounded-xl mt-2"
            >
              @if (isSubmitting) {
                <ion-spinner name="crescent" class="mr-2"></ion-spinner>
                Enregistrement…
              } @else {
                <i class="pi pi-plus mr-2"></i>
                Créer le tarif
              }
            </ion-button>

          </form>
        </ion-content>
      </ng-template>
    </ion-modal>
