<ion-header class="ion-no-border">
  <ion-toolbar class="[--background:transparent] px-2">
    <ion-title class="text-center font-bold text-gray-900 text-lg tracking-tight px-0">
      Demande de Devis
    </ion-title>
    @if (draft().step > 1 && draft().step < 4) {
      <ion-buttons slot="start">
        <button
          (click)="goToStep($any(draft().step - 1))"
          class="ml-2 flex h-10 w-10 items-center justify-center rounded-xl
                 bg-gray-100 text-gray-900 transition active:scale-90"
        >
          <i class="pi pi-chevron-left text-xs font-bold"></i>
        </button>
      </ion-buttons>
    }
  </ion-toolbar>
</ion-header>

<ion-content class="[--background:#f8f9fb]">
  <div class="flex flex-col gap-6 px-5 py-6">

    <!-- ── Étapes 1-3 : wizard ───────────────────────────────────────── -->
    @if (draft().step < 4) {

      <!-- Stepper Progress -->
      <div class="flex items-center px-2">
        @for (s of [1, 2, 3]; track s) {
          <div class="flex flex-1 items-center">
            <div class="flex h-8 w-8 items-center justify-center rounded-xl border-2
                        text-[10px] font-black transition-all duration-300"
                 [class]="draft().step >= s
                   ? 'border-transparent text-white shadow-lg scale-110'
                   : 'border-gray-200 text-gray-400 bg-white'"
                 [style.background]="draft().step >= s ? 'var(--ion-color-primary)' : ''"
                 [style.box-shadow]="draft().step >= s
                   ? '0 4px 12px color-mix(in srgb, var(--ion-color-primary) 30%, transparent)'
                   : 'none'"
            >
              {{ s }}
            </div>
            @if (s < 3) {
              <div class="h-[2px] flex-1 mx-2 rounded-full transition-colors duration-300"
                   [style.background]="draft().step > s ? 'var(--ion-color-primary)' : '#e5e7eb'">
              </div>
            }
          </div>
        }
      </div>

      <!-- Rendu de l'étape courante -->
      @switch (draft().step) {
        @case (1) { <app-step-adresse /> }
        @case (2) { <app-step-produit /> }
        @case (3) { <app-step-logistique /> }
      }
    }

    <!-- ── Étape 4 : propositions ────────────────────────────────────── -->
    @else {
      <app-devis-propositions />
    }

  </div>
</ion-content>
