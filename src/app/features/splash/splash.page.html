<ion-content [fullscreen]="true" style="--background: transparent">
  <div class="relative flex min-h-screen flex-col items-center justify-center overflow-hidden bg-primary px-8 py-10">

    <!-- Contenu principal -->
    <div class="z-10 flex flex-col items-center justify-center text-center">
      
      <!-- Logo -->
      <div class="mb-6 flex h-28 w-28 items-center justify-center rounded-[2rem] bg-white p-4 shadow-xl shadow-black/10 backdrop-blur-sm">
        <img
          src="assets/android-chrome-192x192.png"
          alt="Logo Matériaux Express"
          class="h-full w-full object-contain"
        />
      </div>

      <!-- Branding -->
      <div class="space-y-2">
        <h1 class="text-2xl font-black tracking-tight text-white">
          Matériaux Express
        </h1>
        <p class="text-sm font-medium text-white/70">
          La marketplace B2B des matériaux
        </p>
      </div>

      <!-- Loader -->
      <div class="mt-10 flex flex-col items-center gap-3">
        <div class="h-10 w-10 rounded-full border-[3px] border-white/20 border-t-white animate-spin"></div>
        <p class="text-[11px] font-bold uppercase tracking-[0.18em] text-white/50">
          Chargement...
        </p>
      </div>
    </div>

    <!-- Footer -->
    <div class="absolute bottom-8 z-10">
      <p class="text-[10px] font-medium uppercase tracking-[0.18em] text-white/40">
        Propulsé par <span class="text-white/70">Sogetrap</span>
      </p>
    </div>
  </div>
</ion-content>
