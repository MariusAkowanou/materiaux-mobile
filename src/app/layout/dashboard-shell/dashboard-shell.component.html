<div class="flex h-screen w-full flex-col overflow-hidden bg-gray-50">
  <!-- Contenu principal -->
  <div class="relative min-h-0 flex-1 overflow-hidden">
    <ion-router-outlet />
  </div>

  <!-- Bottom navigation -->
  <ion-tab-bar
    slot="bottom"
    class="shrink-0 border-t border-white/10 bg-[#0d5689] px-2 pb-[max(env(safe-area-inset-bottom),0.35rem)] pt-2"
  >
    @for (tab of tabs(); track tab.tab) {
      <ion-tab-button
        [tab]="tab.tab"
        [routerLink]="tab.route"
        routerLinkActive="tab-selected"
        class="min-h-[56px] rounded-xl [--background:transparent] [--color:rgba(255,255,255,0.62)] [--color-selected:#dc7a34] [--ripple-color:rgba(220,122,52,0.18)] transition-all duration-200"
      >
        <i
          [class]="tab.icon + ' mb-1 text-[1.2rem] leading-none transition-all duration-200 [.tab-selected_&]:scale-105 [.tab-selected_&]:text-[#dc7a34]'"
        ></i>

        <ion-label class="text-[0.68rem] font-semibold tracking-wide">
          {{ tab.label }}
        </ion-label>
      </ion-tab-button>
    }
  </ion-tab-bar>
</div>
